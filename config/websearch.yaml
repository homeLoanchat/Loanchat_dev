cache:
  directory: data/web_cache
  ttl_seconds: 86400
provider:
  base_url: https://api.upstage.ai/v1/web-search
  method: GET
  query_param: query
  payload: params
  params:
    language: ko
    size: 5
  headers:
    Authorization: Bearer ${UPSTAGE_SEARCH_KEY}
  timeout: 8
  max_results: 5
  response:
    items_path:
      - data
      - results
    title_field: title
    url_field: url
    snippet_field: snippet
whitelist_path: src/websearch/whitelist.yaml
