cache:
  directory: data/web_cache
  ttl_seconds: 86400
provider:
  base_url: https://serpapi.com/search
  method: GET
  query_param: q
  payload: params
  params:
    api_key: ${SERPAPI_KEY}
    engine: google
    hl: ko
    gl: kr
    num: 5
  headers: {}
  timeout: 8
  max_results: 5
  response:
    items_path:
      - organic_results
    title_field: title
    url_field: link
    snippet_field: snippet
whitelist_path: src/websearch/whitelist.yaml
